<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceControl - Criar Conta</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                },
            },
        }
    </script>
    <script src="script.js" defer></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800/80 rounded-2xl p-8 shadow-2xl">
        <div class="flex flex-col items-center mb-6">
            <div class="flex items-center justify-center w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 rounded-xl mb-3">
                <img src="logo.png" alt="Logo" class="w-7 h-7 object-contain">
            </div>
            <h1 class="text-xl font-bold tracking-wide">Criar nova conta</h1>
            <p class="text-xs text-zinc-400 mt-1">Preencha os campos para iniciar seu controle financeiro</p>
        </div>

        <div id="errorMessage" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs p-3 rounded-lg mb-4 text-center"></div>

        <form id="registerForm" class="flex flex-col gap-4">
            <div class="flex flex-col gap-1.5">
                <label for="regName" class="text-xs font-medium text-zinc-400">Nome Completo</label>
                <input 
                    type="text" 
                    id="regName" 
                    placeholder="Seu nome" 
                    required
                    class="bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/80 transition"
                >
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="regEmail" class="text-xs font-medium text-zinc-400">E-mail</label>
                <input 
                    type="email" 
                    id="regEmail" 
                    placeholder="seu@email.com" 
                    required
                    class="bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/80 transition"
                >
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="regPassword" class="text-xs font-medium text-zinc-400">Senha</label>
                <input 
                    type="password" 
                    id="regPassword" 
                    placeholder="••••••••" 
                    required
                    class="bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/80 transition"
                >
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="regConfirmPassword" class="text-xs font-medium text-zinc-400">Confirmar Senha</label>
                <input 
                    type="password" 
                    id="regConfirmPassword" 
                    placeholder="••••••••" 
                    required
                    class="bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/80 transition"
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition mt-2"
            >
                Cadastrar
            </button>
        </form>

        <div class="mt-6 border-t border-zinc-800/80 pt-4 text-center">
            <p class="text-xs text-zinc-400">
                Já possui uma conta? 
                <a href="telaLogin.html" class="text-emerald-400 hover:underline font-medium">Fazer Login</a>
            </p>
        </div>
    </div>
</body>
</html>
