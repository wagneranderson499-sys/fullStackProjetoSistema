<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceControl - Login</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                },
            },
        }

        // Função para alternar visibilidade da senha
        function alternarSenha() {
            const campoSenha = document.getElementById('loginPassword');
            const iconeOlho = document.getElementById('iconeOlho');
            
            if (campoSenha.type === 'password') {
                campoSenha.type = 'text';
                // Ícone de olho aberto / escondido
                iconeOlho.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"></path>`;
            } else {
                campoSenha.type = 'password';
                // Ícone de olho normal
                iconeOlho.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>`;
            }
        }
    </script>
    <script src="script.js" defer></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800/80 rounded-2xl p-8 shadow-2xl">
        <div class="flex flex-col items-center mb-8">
            <div class="flex items-center justify-center w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 rounded-xl mb-3">
                <img src="logo.png" alt="Logo" class="w-7 h-7 object-contain">
            </div>
            <h1 class="text-xl font-bold tracking-wide">Finance<span class="text-emerald-500">Control</span></h1>
            <p class="text-xs text-zinc-400 mt-1">Acesse sua conta para gerenciar suas finanças</p>
        </div>

        <!-- Área de Mensagem de Erro -->
        <div id="mensagemErro" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-xs text-red-400 text-center">
            E-mail ou senha incorretos.
        </div>

        <form id="loginForm" onsubmit="return fazerLogin(event)" class="flex flex-col gap-4">
            <div class="flex flex-col gap-1.5">
                <label for="loginEmail" class="text-xs font-medium text-zinc-400">E-mail</label>
                <input 
                    type="email" 
                    id="loginEmail" 
                    placeholder="seu@email.com" 
                    required
                    class="bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/80 transition"
                >
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="loginPassword" class="text-xs font-medium text-zinc-400">Senha</label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="loginPassword" 
                        placeholder="••••••••" 
                        required
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg pl-3.5 pr-10 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/80 transition"
                    >
                    <button 
                        type="button" 
                        onclick="alternarSenha()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-300 transition focus:outline-none"
                    >
                        <svg id="iconeOlho" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <button 
                type="submit" 
                id="btnLogin"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2"
            >
                <span id="btnLoginText">Entrar</span>
                <svg id="btnLoginSpinner" class="w-4 h-4 text-white animate-spin hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <div class="mt-6 border-t border-zinc-800/80 pt-4 text-center">
            <p class="text-xs text-zinc-400">
                Ainda não tem uma conta? 
                <a href="cadastro.html" class="text-emerald-400 hover:underline font-medium">Cadastre-se</a>
            </p>
        </div>
    </div>
</body>
</html>
