<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceControl - Confirmar E-mail</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                },
            },
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Container do Modal / Card de Confirmação -->
    <div id="emailModalContainer" class="w-full max-w-md bg-zinc-900 border border-zinc-800/80 rounded-2xl p-8 shadow-2xl relative">
        
        <div class="flex flex-col items-center mb-6">
            <div class="flex items-center justify-center w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 rounded-xl mb-3">
                <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </div>
            <h1 class="text-xl font-bold tracking-wide text-zinc-100">Verifique seu E-mail</h1>
            <p class="text-xs text-zinc-400 mt-1 text-center">
                Enviamos um código de 6 dígitos para o seu e-mail.<br>Insira-o abaixo para ativar sua conta.
            </p>
        </div>

        <!-- Alertas de Sucesso e Erro -->
        <div id="verifySuccess" class="hidden bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs p-3 rounded-lg mb-4 text-center font-medium"></div>
        <div id="verifyError" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs p-3 rounded-lg mb-4 text-center"></div>

        <!-- Formulário do Código -->
        <form id="verifyForm" class="flex flex-col gap-4">
            <div class="flex flex-col gap-1.5">
                <label for="inputCode" class="text-xs font-medium text-zinc-400">Código de Confirmação</label>
                <input 
                    type="text" 
                    id="inputCode" 
                    placeholder="000000" 
                    maxlength="6"
                    required
                    class="bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-3 text-center text-lg font-mono tracking-widest text-zinc-100 placeholder-zinc-700 focus:outline-none focus:border-emerald-500/80 transition"
                >
            </div>

            <button 
                type="submit" 
                id="btnVerify"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition mt-1 flex items-center justify-center gap-2"
            >
                <span id="btnVerifyText">Ativar Minha Conta</span>
                <svg id="btnVerifySpinner" class="w-4 h-4 text-white animate-spin hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <div class="mt-6 border-t border-zinc-800/80 pt-4 text-center">
            <p class="text-xs text-zinc-400">
                Ainda não recebeu? 
                <a href="registro.html" class="text-emerald-400 hover:underline font-medium">Voltar ao cadastro</a>
            </p>
        </div>
    </div>

    <!-- Script de Integração com Backend -->
    <script>
        const API_BASE_URL = 'http://localhost:8080/api/auth';

        const verifyForm = document.getElementById('verifyForm');
        const verifySuccess = document.getElementById('verifySuccess');
        const verifyError = document.getElementById('verifyError');
        const btnVerify = document.getElementById('btnVerify');
        const btnVerifyText = document.getElementById('btnVerifyText');
        const btnVerifySpinner = document.getElementById('btnVerifySpinner');

        if (verifyForm) {
            verifyForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                // Esconde mensagens de erro/sucesso
                verifySuccess.classList.add('hidden');
                verifyError.classList.add('hidden');

                const codeInput = document.getElementById('inputCode').value.trim();
                const email = localStorage.getItem('userEmailPendingVerification');

                if (!email) {
                    verifyError.innerText = "Sessão expirada. Redirecionando para o cadastro...";
                    verifyError.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = 'registro.html';
                    }, 2000);
                    return;
                }

                // Estado de Carregamento
                btnVerify.disabled = true;
                btnVerifyText.innerText = "Verificando...";
                btnVerifySpinner.classList.remove('hidden');

                try {
                    const response = await fetch(`${API_BASE_URL}/verify`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            codigo: codeInput
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        verifySuccess.innerText = "✓ " + (data.message || "E-mail verificado com sucesso!");
                        verifySuccess.classList.remove('hidden');
                        localStorage.removeItem('userEmailPendingVerification');
                        
                        setTimeout(() => {
                            window.location.href = 'telaLogin.html';
                        }, 1500);
                    } else {
                        verifyError.innerText = data.message || "Código incorreto. Por favor, tente novamente.";
                        verifyError.classList.remove('hidden');
                    }
                } catch (error) {
                    console.error('Erro de requisição:', error);
                    verifyError.innerText = "Não foi possível conectar ao servidor backend.";
                    verifyError.classList.remove('hidden');
                } finally {
                    // Restaura estado do botão
                    btnVerify.disabled = false;
                    btnVerifyText.innerText = "Ativar Minha Conta";
                    btnVerifySpinner.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
